name: ci

on:
  push:
    branches: [main]
  pull_request:

# One list, used by both shell steps below. It was two, and .githooks/pre-commit was
# added to neither — a new script joining half the checks is the failure this prevents.
env:
  SHELL_FILES: >-
    install.sh
    uninstall.sh
    doctor.sh
    hooks/claude-session-notifier.sh
    tests/run-tests.sh
    .githooks/pre-commit

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the banner
        run: swiftc -O -o /tmp/claude-banner src/banner.swift

      - name: Shell syntax check
        run: |
          for f in $SHELL_FILES; do
            bash -n "$f" && echo "ok  $f"
          done

      - name: Shellcheck
        run: |
          brew install shellcheck
          # Unquoted on purpose: the list must word-split into separate arguments.
          # shellcheck disable=SC2086
          shellcheck $SHELL_FILES

      - name: Installer preflight (dry run)
        run: |
          mkdir -p "$HOME/.claude"
          ./install.sh --dry-run

      # The dispatcher's regression set. Runs the real script against a throwaway HOME
      # rather than a reimplementation, and asserts on what it emitted — exit 0 has never
      # been evidence of anything in this project.
      - name: Tests
        run: ./tests/run-tests.sh
